# Render 后端服务部署配置
# 文档：https://render.com/docs/blueprint-spec
# 使用：在 Render 控制台 New > Blueprint 选择仓库，会自动读取此文件

services:
  - type: web
    name: fitzone-backend
    runtime: node
    plan: free                  # 免费套餐
    region: singapore           # 新加坡区域（亚洲访问较快）
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true    # Render 自动生成随机密钥
      - key: FRONTEND_URL
        sync: false             # 部署后手动填写 Vercel 前端域名
      - key: UPSTASH_REDIS_REST_URL
        sync: false             # 部署后填写 Upstash 地址
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false             # 部署后填写 Upstash Token
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
